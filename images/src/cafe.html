<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#222}
#art{width:1200px;height:900px;background:#7a5230 linear-gradient(135deg,#8a6038,#5e3d22);display:grid;place-items:center}
.board{width:1060px;height:800px;background:#22302a radial-gradient(ellipse at 30% 20%,#2d3f37,#1c2722 70%);border:26px solid #4a2f1a;border-radius:10px;box-sizing:border-box;
  box-shadow:inset 0 0 60px rgba(0,0,0,.6),0 20px 40px rgba(0,0,0,.45);color:#f4f1e6;font-family:Kalam,cursive;padding:30px 70px;position:relative}
h1{font-family:"Amatic SC",cursive;font-size:96px;margin:0;text-align:center;letter-spacing:4px;color:#ffe9a8}
.row{display:flex;justify-content:space-between;align-items:baseline;font-size:44px;line-height:1.35;border-bottom:2px dashed rgba(244,241,230,.18)}
.row span:last-child{font-weight:700;color:#ffd2a1}
.note{font-size:32px;margin-top:22px;color:#cfe8d8}
.foot{position:absolute;left:70px;right:70px;bottom:26px;display:flex;justify-content:space-between;font-size:32px;color:#ffe9a8;font-weight:700}
</style></head><body><div id="art"><div class="board">
<h1>TODAY'S SPECIALS</h1>
<div class="row"><span>Flat white</span><span>$5.50</span></div>
<div class="row"><span>Sausage roll</span><span>$6.50</span></div>
<div class="row"><span>Smashed avocado on sourdough</span><span>$19.00</span></div>
<div class="row"><span>Lamington</span><span>$4.50</span></div>
<div class="row"><span>Iced long black</span><span>$6.00</span></div>
<div class="note">Gluten-free options available. Please ask about allergies.</div>
<div class="foot"><span>Card only, sorry, no cash</span><span>Open 7am to 3pm</span></div>
</div></div></body></html>
