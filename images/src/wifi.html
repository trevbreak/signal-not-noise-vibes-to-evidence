<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#222}
#art{width:1200px;height:900px;position:relative;overflow:hidden;background:#cfc6b8 linear-gradient(180deg,#d9d1c4,#bfb5a5);font-family:Inter,sans-serif;display:grid;place-items:center}
.frame{width:880px;height:740px;background:#2b2b2b;padding:26px;box-sizing:border-box;box-shadow:0 22px 50px rgba(0,0,0,.45);border-radius:8px}
.sign{width:100%;height:100%;background:#fff;box-sizing:border-box;padding:46px 60px;display:flex;flex-direction:column;color:#151515;text-align:center}
.logo{font-size:30px;font-weight:900;letter-spacing:6px;color:#2a6f4f}
h1{font-size:62px;font-weight:900;margin:10px 0 26px;line-height:1}
.wifi{width:120px;height:90px;margin:0 auto 20px}
.row{display:flex;justify-content:space-between;align-items:center;border:3px solid #151515;border-radius:12px;padding:16px 26px;margin-bottom:16px;font-size:30px;font-weight:700}
.row code{font-family:"JetBrains Mono",monospace;font-size:36px;background:#eef5f1;padding:4px 14px;border-radius:8px}
.help{margin-top:auto;font-size:26px;font-weight:700}
.small{font-size:22px;font-weight:500;color:#555;margin-top:8px}
</style></head><body><div id="art"><div class="frame"><div class="sign">
<div class="logo">ACME</div>
<h1>Welcome! Guest Wi-Fi</h1>
<svg class="wifi" viewBox="0 0 120 90"><path d="M8 34 Q60 -10 112 34" fill="none" stroke="#151515" stroke-width="10" stroke-linecap="round"/><path d="M26 52 Q60 22 94 52" fill="none" stroke="#151515" stroke-width="10" stroke-linecap="round"/><path d="M44 70 Q60 56 76 70" fill="none" stroke="#151515" stroke-width="10" stroke-linecap="round"/><circle cx="60" cy="84" r="6" fill="#151515"/></svg>
<div class="row"><span>Network</span><code>Acme-Guest</code></div>
<div class="row"><span>Password</span><code>Sprint2026!</code></div>
<div class="help">Trouble connecting? Call reception on ext 4455.</div>
<div class="small">Please don't stream the cricket.</div>
</div></div></div></body></html>
