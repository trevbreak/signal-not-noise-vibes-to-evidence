<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#222}
#art{width:1200px;height:900px;background:#6f7378 linear-gradient(180deg,#80858a,#5d6166);display:grid;place-items:center;font-family:Inter,Arial,sans-serif}
.sign{width:1000px;height:800px;background:#fff;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.45);overflow:hidden;display:grid;grid-template-rows:auto auto 1fr auto}
.band{background:#0047ab;color:#fff;font-weight:900;font-size:46px;letter-spacing:2px;text-align:center;padding:16px 0}
.icons{display:flex;justify-content:center;gap:46px;padding:26px 0 8px}
.icon{width:140px;height:140px;border-radius:50%;background:#0047ab;display:grid;place-items:center}
.icon svg{width:92px;height:92px;fill:#fff}
.must{text-align:center;font-size:40px;font-weight:900;line-height:1.15;padding:10px 60px 18px;color:#111}
.warn{background:#ffd200;display:flex;align-items:center;gap:30px;padding:22px 40px;border-top:6px solid #111}
.tri{width:120px;height:106px;flex:none}
.warn .t{font-size:34px;font-weight:900;line-height:1.15;color:#111}
.warn .t span{display:block;font-size:46px}
.foot{background:#111;color:#fff;display:flex;justify-content:space-between;padding:16px 40px;font-size:26px;font-weight:800}
</style></head><body><div id="art"><div class="sign">
<div class="band">MANDATORY</div>
<div>
<div class="icons">
 <div class="icon"><svg viewBox="0 0 100 100"><path d="M14 66 Q14 26 50 22 Q86 26 86 66 Z"/><rect x="6" y="64" width="88" height="12" rx="4"/><rect x="46" y="14" width="8" height="18" rx="3"/></svg></div>
 <div class="icon"><svg viewBox="0 0 100 100"><path d="M30 10 L42 10 L50 24 L58 10 L70 10 L84 26 L76 92 L24 92 L16 26 Z"/><rect x="22" y="50" width="56" height="8" fill="#0047ab"/><rect x="22" y="68" width="56" height="8" fill="#0047ab"/></svg></div>
 <div class="icon"><svg viewBox="0 0 100 100"><path d="M26 12 L48 12 L48 56 Q72 56 86 70 L90 84 L14 84 L14 70 L26 66 Z"/><rect x="12" y="84" width="80" height="8" rx="2"/></svg></div>
</div>
<div class="must">HARD HATS, HI-VIS AND STEEL-CAPPED BOOTS MUST BE WORN BEYOND THIS POINT</div>
</div>
<div></div>
<div>
<div class="warn">
 <svg class="tri" viewBox="0 0 120 106"><path d="M60 4 L116 102 L4 102 Z" fill="#ffd200" stroke="#111" stroke-width="9" stroke-linejoin="round"/><rect x="40" y="56" width="34" height="22" fill="#111"/><rect x="72" y="42" width="6" height="36" fill="#111"/><rect x="76" y="66" width="16" height="5" fill="#111"/><circle cx="48" cy="84" r="7" fill="#111"/><circle cx="68" cy="84" r="7" fill="#111"/></svg>
 <div class="t"><span>WARNING: FORKLIFTS OPERATING</span>Pedestrians must use marked walkways at all times</div>
</div>
<div class="foot"><span>Max racking load 500 kg per shelf</span><span>Emergency: call 000 · First aid: ext 4455</span></div>
</div>
</div></div></body></html>
